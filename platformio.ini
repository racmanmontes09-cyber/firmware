; PlatformIO Project Configuration File

[env:4d_systems_esp32s3_gen4_r8n16]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino

monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

; Load LEAF_* config (WIFI/MQTT/device/sensor) from .env and inject it as
; CPPDEFINES. This is required so plain `pio run` (without the build.sh env
; export wrapper) embeds real MQTT_HOST/DEVICE_ID/topics instead of empty.
extra_scripts = pre:tools/load_env.py


; Use release optimizations for production builds
build_type = release

build_flags = 
	-DARDUINO_RUNNING_CORE=1
	-DARDUINO_EVENT_RUNNING_CORE=1
	; Board json sets ARDUINO_USB_CDC_ON_BOOT=1 which routes `Serial` to the
	; native USB-Serial-JTAG peripheral. This board's USB-C jack is wired via
	; an external CH343 bridge to UART0, so nothing on the host side can ever
	; see native-CDC output. Force `Serial` back to UART0 (the CH343 port).
	-UARDUINO_USB_CDC_ON_BOOT
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DCORE_DEBUG_LEVEL=3
	-DLOG_LOCAL_LEVEL=3
	-DSERIAL_READINGS_ONLY=0
	-DSERIAL_DIAG_ENABLED=1
	-DSERIAL_NETWORK_DEBUG=1
	; LEAF_* config (WIFI/MQTT/device/sensor flags) is injected from .env by
	; tools/load_env.py (see extra_scripts above). We deliberately do NOT use
	; ${sysenv.LEAF_*} here: PlatformIO expands sysenv before pre-scripts run,
	; so with plain `pio run` those macros compiled to empty strings.
	-DFIRMWARE_VERSION='"1.2.0"'

build_src_filter =
	+<*.cpp>
	-<bootprobe/bootprobe_main.cpp>

upload_protocol = esptool
upload_speed = 460800

; ✅ CORRECT: Use underscore for hard_reset
upload_flags = 
	--before=default_reset
	--after=hard_reset

lib_deps = 
	adafruit/Adafruit SHT31 Library@^2.2.2
	milesburton/DallasTemperature@^4.0.6
	paulstoffregen/OneWire@^2.3.8
	knolleary/PubSubClient@^2.8
	vshymanskyy/TinyGSM@^0.12.0

; ===========================================================================
; Boot isolation probes (TEST 0..8). Binary-search firmware variants.
; Flags are IDENTICAL in all diag envs (and match the effective flags of the
; main env after platformio_override.ini replaces its build_flags); the only
; variable between diagN and diagN-1 is -DLEAF_BOOT_TEST=N.
;
; Usage:
;   pio run -e diag6 -t erase && pio run -e diag6 -t upload
;   python3 tools/boot_matrix.py --envs diag0 diag1 ... 
; ===========================================================================
[diag_base_env]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
monitor_speed = 115200
extra_scripts = pre:tools/load_env.py
upload_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B3E035144-if00
monitor_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B3E035144-if00
build_type = release
upload_protocol = esptool
upload_speed = 460800
upload_flags = 
	--before=default_reset
	--after=hard_reset
lib_deps = 
	adafruit/Adafruit SHT31 Library@^2.2.2
	milesburton/DallasTemperature@^4.0.6
	paulstoffregen/OneWire@^2.3.8
	knolleary/PubSubClient@^2.8
	vshymanskyy/TinyGSM@^0.12.0
; Keep every module compiled in every variant so image layout and static
; constructors stay comparable; only executed statements differ per stage.
build_src_filter = 
	+<*.cpp>
	+<bootprobe/bootprobe_main.cpp>
	-<main.cpp>

[diag_flags]
build_flags =
	; Match the main env: Serial must map to UART0 (see main env comment).
	-UARDUINO_USB_CDC_ON_BOOT
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DCORE_DEBUG_LEVEL=3
	; Device identity, MQTT broker, credentials and topics are injected from
	; .env by tools/load_env.py (see diag_base_env extra_scripts) — the single
	; config path used by the main env. Nothing MQTT/credential is hardcoded
	; here; only the diag-specific firmware marker is pinned below.
	-DFIRMWARE_VERSION='"diag"'

[env:diag0]
extends = diag_base_env, diag_flags
build_flags = ${diag_flags.build_flags} -DLEAF_BOOT_TEST=0

[env:diag1]
extends = diag_base_env, diag_flags
build_flags = ${diag_flags.build_flags} -DLEAF_BOOT_TEST=1

[env:diag2]
extends = diag_base_env, diag_flags
build_flags = ${diag_flags.build_flags} -DLEAF_BOOT_TEST=2

[env:diag3]
extends = diag_base_env, diag_flags
build_flags = ${diag_flags.build_flags} -DLEAF_BOOT_TEST=3

[env:diag4]
extends = diag_base_env, diag_flags
build_flags = ${diag_flags.build_flags} -DLEAF_BOOT_TEST=4

[env:diag5]
extends = diag_base_env, diag_flags
build_flags = ${diag_flags.build_flags} -DLEAF_BOOT_TEST=5

[env:diag6]
extends = diag_base_env, diag_flags
build_flags = ${diag_flags.build_flags} -DLEAF_BOOT_TEST=6

[env:diag7]
extends = diag_base_env, diag_flags
build_flags = ${diag_flags.build_flags} -DLEAF_BOOT_TEST=7

[env:diag8]
extends = diag_base_env, diag_flags
build_flags = ${diag_flags.build_flags} -DLEAF_BOOT_TEST=8

; ===========================================================================
; TEMPORARY fan relay isolation test (see docs/fan-relay-isolation-test.md).
; Clones the production env (same flags config + .env injection) and adds the
; LEAF_FAN_DIAG instrumentation. DOES NOT modify the production env. When the
; diagnostic is finished, DELETE this whole section to revert.
; ===========================================================================
[env:leaf_fan_diag]
extends = env:4d_systems_esp32s3_gen4_r8n16
build_flags =
	-DARDUINO_RUNNING_CORE=1
	-DARDUINO_EVENT_RUNNING_CORE=1
	-UARDUINO_USB_CDC_ON_BOOT
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DCORE_DEBUG_LEVEL=3
	-DLOG_LOCAL_LEVEL=3
	-DSERIAL_READINGS_ONLY=0
	-DSERIAL_DIAG_ENABLED=1
	-DSERIAL_NETWORK_DEBUG=1
	-DFIRMWARE_VERSION='"1.2.0-diag-fan-emi"'
	-DLEAF_FAN_DIAG=1
	-DEMI_DIAG_LOGGING=1

; EMI-only diagnostic: relay stays ACTIVE, SHT31 I²C logging enabled.
; Use this to observe EMI-induced SHT31 failures in real time.
; The fan will cycle naturally; the [EMI-DIAG] lines prove/deny the
; correlation between relay state and I²C errors.
; ===========================================================================
[env:leaf_emi_diag]
extends = env:4d_systems_esp32s3_gen4_r8n16
build_flags =
	-DARDUINO_RUNNING_CORE=1
	-DARDUINO_EVENT_RUNNING_CORE=1
	-UARDUINO_USB_CDC_ON_BOOT
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DCORE_DEBUG_LEVEL=3
	-DLOG_LOCAL_LEVEL=3
	-DSERIAL_READINGS_ONLY=0
	-DSERIAL_DIAG_ENABLED=1
	-DSERIAL_NETWORK_DEBUG=1
	-DFIRMWARE_VERSION='"1.2.0-diag-emi-only"'
	-DEMI_DIAG_LOGGING=1